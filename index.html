<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[제작]</title>
  <style>
    /* =========================================================================
       1. 기본 초기화 및 디자인 토큰 (아이보리 & 차콜 에디토리얼 톤)
       ========================================================================= */
    :root {
      --bg-ivory: #FAF9F6;
      --bg-ivory-sub: #F4F2EC;
      --bg-ivory-hover: #ECE9E0;
      --bg-white: #FFFFFF;
      --border-warm: #E5E3DC;
      --border-strong: #CFCBC0;
      --ink-primary: #1C1B19;
      --ink-secondary: #4D4B45;
      --ink-muted: #7C7970;
      --ink-faint: #A3A096;
      --danger: #D9383A;
      --danger-bg: #FDF2F2;
      --success: #15803D;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-card: 0 1px 3px rgba(28, 27, 25, 0.04), 0 4px 12px rgba(28, 27, 25, 0.025);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100vh;
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-ivory);
      color: var(--ink-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, opacity 0.15s ease;
    }

    button:disabled {
      opacity: 0.28;
      cursor: not-allowed;
    }

    /* 커스텀 스크롤바 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(124, 121, 112, 0.3);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(77, 75, 69, 0.55);
    }

    /* =========================================================================
       2. 상단 메인 헤더 (height: 54px 고정)
       ========================================================================= */
    .app-header {
      height: 54px;
      flex-shrink: 0;
      background-color: var(--bg-white);
      border-bottom: 1px solid var(--border-warm);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 20;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background-color: var(--ink-primary);
      color: var(--bg-ivory);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: -0.5px;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink-primary);
    }

    .save-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      color: var(--ink-muted);
      background-color: var(--bg-ivory);
      border: 1px solid var(--border-warm);
      padding: 3px 10px;
      border-radius: 999px;
    }

    .save-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #16A34A;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 32px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }

    .btn-outline {
      background-color: var(--bg-white);
      border: 1px solid var(--border-warm);
      color: var(--ink-secondary);
    }
    .btn-outline:hover {
      background-color: var(--bg-ivory-sub);
      border-color: var(--border-strong);
      color: var(--ink-primary);
    }

    .btn-soft {
      background-color: var(--bg-ivory-sub);
      border: 1px solid var(--border-warm);
      color: var(--ink-primary);
    }
    .btn-soft:hover {
      background-color: var(--bg-ivory-hover);
    }

    .btn-primary {
      background-color: var(--ink-primary);
      border: 1px solid var(--ink-primary);
      color: var(--bg-white);
      font-weight: 600;
    }
    .btn-primary:hover {
      background-color: #33312D;
    }

    .btn-danger-soft {
      background-color: var(--danger-bg);
      border: 1px solid #FAD1D1;
      color: var(--danger);
    }
    .btn-danger-soft:hover {
      background-color: #FCE4E4;
    }

    .divider-v {
      width: 1px;
      height: 18px;
      background-color: var(--border-warm);
      margin: 0 2px;
    }

    /* =========================================================================
       3. 상단 서브바 - 멀티 시트/게시글 탭 & 현재 시트 제목 관리 (height: 46px 고정)
       ========================================================================= */
    .sub-bar {
      height: 46px;
      flex-shrink: 0;
      background-color: var(--bg-ivory-sub);
      border-bottom: 1px solid var(--border-warm);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .tabs-area {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      padding: 4px 0;
    }

    .tabs-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-muted);
      white-space: nowrap;
      margin-right: 2px;
    }

    .tabs-list {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sheet-tab {
      height: 30px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      border: 1px solid transparent;
      color: var(--ink-secondary);
      background-color: rgba(255, 255, 255, 0.55);
    }

    .sheet-tab:hover {
      background-color: var(--bg-white);
      color: var(--ink-primary);
    }

    .sheet-tab.active {
      background-color: var(--ink-primary);
      color: var(--bg-white);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    .btn-new-sheet {
      height: 30px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-primary);
      background-color: var(--bg-white);
      border: 1px dashed var(--border-strong);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-new-sheet:hover {
      border-style: solid;
      border-color: var(--ink-primary);
      background-color: var(--bg-ivory);
    }

    .sheet-meta-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .title-edit-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: var(--bg-white);
      border: 1px solid var(--border-warm);
      border-radius: var(--radius-sm);
      padding: 0 8px;
      height: 30px;
    }
    .title-edit-box:focus-within {
      border-color: var(--ink-primary);
    }

    .title-tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-muted);
      background-color: var(--bg-ivory-sub);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .title-input {
      border: none;
      outline: none;
      background: transparent;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-primary);
      width: 150px;
    }

    /* =========================================================================
       4. 메인 작업 영역: 무조건 좌우 2분할 고정 (절대 1열로 무너지지 않음)
       ========================================================================= */
    .workspace-main {
      display: flex;
      flex-direction: row;
      flex: 1;
      min-height: 0;
      width: 100%;
      overflow: hidden;
    }

    /* 왼쪽 패널 (1번 영역 - 폭 310px 고정) */
    .left-sidebar {
      width: 310px;
      min-width: 310px;
      max-width: 310px;
      flex-shrink: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-ivory);
      border-right: 1px solid var(--border-warm);
    }

    .panel-header {
      height: 44px;
      flex-shrink: 0;
      padding: 0 16px;
      background-color: var(--bg-white);
      border-bottom: 1px solid var(--border-warm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .panel-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-badge {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background-color: var(--ink-primary);
      color: var(--bg-white);
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-primary);
    }

    .count-pill {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-secondary);
      background-color: var(--bg-ivory-sub);
      border: 1px solid var(--border-warm);
      padding: 1px 8px;
      border-radius: 999px;
    }

    .add-field-box {
      padding: 12px 14px 10px 14px;
      border-bottom: 1px solid var(--border-warm);
      background-color: var(--bg-ivory);
      flex-shrink: 0;
    }

    .add-field-form {
      display: flex;
      gap: 6px;
    }

    .text-input {
      flex: 1;
      min-width: 0;
      height: 32px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-warm);
      background-color: var(--bg-white);
      font-size: 12px;
      outline: none;
    }
    .text-input:focus {
      border-color: var(--ink-primary);
    }
    .text-input::placeholder {
      color: var(--ink-faint);
    }

    .helper-hint {
      font-size: 11px;
      color: var(--ink-muted);
      margin-top: 7px;
      line-height: 1.4;
    }

    .checklist-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .check-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 7px 8px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-warm);
      background-color: var(--bg-ivory-sub);
      color: var(--ink-secondary);
      user-select: none;
      transition: background-color 0.12s, border-color 0.12s, transform 0.12s;
    }

    .check-item.checked {
      background-color: var(--bg-white);
      border-color: #C7C3B7;
      color: var(--ink-primary);
      box-shadow: 0 1px 2px rgba(28, 27, 25, 0.03);
    }

    .check-item:hover {
      border-color: var(--ink-muted);
    }

    .check-item.dragging {
      opacity: 0.45;
    }

    .check-item.drag-over {
      border-top: 2px solid var(--ink-primary);
    }

    .check-item-left {
      display: flex;
      align-items: center;
      gap: 7px;
      flex: 1;
      min-width: 0;
    }

    .drag-handle {
      cursor: grab;
      color: var(--ink-faint);
      font-size: 13px;
      letter-spacing: -1px;
      padding: 2px 3px;
      border-radius: 4px;
      flex-shrink: 0;
      line-height: 1;
    }
    .drag-handle:hover {
      color: var(--ink-primary);
      background-color: var(--bg-ivory-hover);
    }
    .drag-handle:active {
      cursor: grabbing;
    }

    .item-checkbox {
      width: 15px;
      height: 15px;
      accent-color: var(--ink-primary);
      cursor: pointer;
      flex-shrink: 0;
    }

    .item-label-text {
      font-size: 12.5px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
      flex: 1;
    }

    .check-item.checked .item-label-text {
      font-weight: 600;
    }

    .item-inline-edit {
      flex: 1;
      min-width: 0;
      height: 22px;
      padding: 0 6px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--ink-primary);
      border-radius: 4px;
      background-color: var(--bg-white);
      outline: none;
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--ink-muted);
    }
    .icon-btn:hover:not(:disabled) {
      background-color: var(--bg-ivory-hover);
      color: var(--ink-primary);
    }
    .icon-btn.del:hover {
      background-color: var(--danger-bg);
      color: var(--danger);
    }

    /* =========================================================================
       5. 오른쪽 패널: 상단(2번 선택 항목 내용 입력) + 하단(실시간 프롬프트 미리보기)
       ========================================================================= */
    .right-workspace {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: var(--bg-ivory);
    }

    /* 오른쪽 상단: 2번 영역 */
    .editor-section {
      flex: 1.3;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid var(--border-warm);
      background-color: var(--bg-ivory);
    }

    .header-sub-hint {
      font-size: 11px;
      color: var(--ink-muted);
    }

    .editor-cards-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty-state-box {
      background-color: var(--bg-white);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 36px 20px;
      text-align: center;
      color: var(--ink-muted);
    }
    .empty-state-box strong {
      display: block;
      font-size: 13px;
      color: var(--ink-primary);
      margin-bottom: 4px;
    }

    .editor-card {
      background-color: var(--bg-white);
      border: 1px solid var(--border-warm);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .editor-card:hover {
      border-color: #C7C3B7;
    }

    .editor-card.dragging {
      opacity: 0.45;
    }

    .editor-card.drag-over {
      box-shadow: 0 -3px 0 0 var(--ink-primary), var(--shadow-card);
    }

    .card-header {
      padding: 8px 14px;
      background-color: var(--bg-ivory-sub);
      border-bottom: 1px solid var(--border-warm);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .card-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .order-num {
      font-size: 11px;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background-color: var(--ink-primary);
      color: var(--bg-white);
      padding: 1px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .card-title-input {
      flex: 1;
      min-width: 0;
      border: 1px solid transparent;
      background: transparent;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-primary);
      padding: 2px 6px;
      border-radius: 4px;
      outline: none;
    }
    .card-title-input:hover {
      background-color: rgba(255, 255, 255, 0.7);
    }
    .card-title-input:focus {
      background-color: var(--bg-white);
      border-color: var(--ink-primary);
    }

    .card-header-right {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .card-action-btn {
      height: 24px;
      padding: 0 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 500;
      color: var(--ink-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .card-action-btn:hover:not(:disabled) {
      background-color: var(--bg-ivory-hover);
      color: var(--ink-primary);
    }
    .card-action-btn.uncheck:hover {
      background-color: var(--danger-bg);
      color: var(--danger);
    }

    .card-body {
      padding: 12px 14px;
    }

    .card-textarea {
      width: 100%;
      min-height: 82px;
      border: none;
      outline: none;
      resize: vertical;
      background: transparent;
      font-size: 13px;
      line-height: 1.6;
      color: var(--ink-primary);
    }
    .card-textarea::placeholder {
      color: var(--ink-faint);
    }

    /* 오른쪽 하단: 실시간 프롬프트 미리보기 */
    .preview-section {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-ivory);
    }

    .preview-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stats-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--bg-ivory-sub);
      border: 1px solid var(--border-warm);
      padding: 3px 10px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      color: var(--ink-muted);
    }
    .stats-pill strong {
      color: var(--ink-primary);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .format-select {
      height: 28px;
      padding: 0 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-warm);
      background-color: var(--bg-ivory);
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-primary);
      outline: none;
      cursor: pointer;
    }
    .format-select:focus {
      border-color: var(--ink-primary);
    }

    .preview-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px 20px 18px 20px;
      display: flex;
      flex-direction: column;
    }

    .preview-box {
      flex: 1;
      width: 100%;
      min-height: 110px;
      background-color: var(--bg-white);
      border: 1px solid var(--border-warm);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Pretendard", monospace;
      font-size: 12.5px;
      line-height: 1.65;
      color: var(--ink-primary);
      white-space: pre-wrap;
      word-break: break-word;
      overflow-y: auto;
      box-shadow: var(--shadow-card);
      user-select: all;
    }

    .preview-placeholder {
      color: var(--ink-faint);
      font-style: italic;
    }

    /* =========================================================================
       6. 커스텀 모달 & 토스트 알림
       ========================================================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(28, 27, 25, 0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background-color: var(--bg-white);
      border: 1px solid var(--border-warm);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 360px;
      padding: 20px;
      box-shadow: 0 12px 32px rgba(28, 27, 25, 0.14);
    }

    .modal-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .modal-desc {
      font-size: 12.5px;
      color: var(--ink-secondary);
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .toast-container {
      position: fixed;
      bottom: 18px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 200;
      pointer-events: none;
    }

    .toast {
      background-color: var(--ink-primary);
      color: var(--bg-white);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16);
      animation: fadeUp 0.18s ease forwards;
    }
    .toast.error {
      background-color: var(--danger);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- ===================================================================== -->
  <!-- 1. 상단 메인 헤더 (height: 54px)                                      -->
  <!-- ===================================================================== -->
  <header class="app-header">
    <div class="header-left">
      <div class="brand-mark">AI</div>
      <h1 class="brand-title">[제작]</h1>
      <span class="save-badge" id="saveStatusBadge">
        <span class="save-dot"></span>
        <span>자동 저장됨</span>
      </span>
    </div>

    <div class="header-actions">
      <button type="button" class="btn btn-outline" id="btnExportJson" title="모든 시트 데이터를 JSON으로 백업">전체 백업</button>
      <label class="btn btn-outline" style="cursor: pointer;" title="JSON 백업 파일 불러오기">
        <span>백업 복원</span>
        <input type="file" id="inputImportJson" accept=".json" style="display: none;" />
      </label>
      <div class="divider-v"></div>
      <button type="button" class="btn btn-soft" id="btnHeaderCopy">전체 복사</button>
      <button type="button" class="btn btn-primary" id="btnDownloadTxt">TXT 메모장 다운로드</button>
    </div>
  </header>

  <!-- ===================================================================== -->
  <!-- 2. 상단 서브바 - 멀티 게시글/시트 탭 & 활성 시트 제목 관리 (height: 46px) -->
  <!-- ===================================================================== -->
  <div class="sub-bar">
    <div class="tabs-area">
      <span class="tabs-label">저장 목록</span>
      <div class="tabs-list" id="projectTabsList"></div>
      <button type="button" class="btn-new-sheet" id="btnNewSheet">+ 새 시트</button>
    </div>

    <div class="sheet-meta-controls">
      <div class="title-edit-box">
        <span class="title-tag">제목</span>
        <input type="text" class="title-input" id="activeSheetTitleInput" placeholder="시트 제목 입력..." />
      </div>
      <button type="button" class="btn btn-outline" id="btnDuplicateSheet" style="height: 30px; padding: 0 10px;">복제</button>
      <button type="button" class="btn btn-danger-soft" id="btnDeleteSheet" style="height: 30px; padding: 0 10px;">삭제</button>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- 3. 메인 작업 영역: 좌우 2분할 고정 (왼쪽 310px + 오른쪽 flex: 1)         -->
  <!-- ===================================================================== -->
  <main class="workspace-main">

    <!-- 왼쪽 패널 (1번 영역: 항목 체크리스트 & 순서 관리) -->
    <aside class="left-sidebar">
      <div class="panel-header">
        <div class="panel-title-group">
          <span class="step-badge">1</span>
          <h2 class="panel-title">항목 및 순서</h2>
        </div>
        <span class="count-pill" id="checkedCountPill">0개 선택</span>
      </div>

      <div class="add-field-box">
        <form class="add-field-form" id="addFieldForm">
          <input type="text" class="text-input" id="newFieldInput" placeholder="새 항목 이름..." />
          <button type="submit" class="btn btn-primary" style="padding: 0 12px;">추가</button>
        </form>
        <p class="helper-hint">체크·순서 변경 시 오른쪽 2번과 미리보기에 즉시 연동됩니다. (항목명 더블클릭 수정)</p>
      </div>

      <div class="checklist-scroll" id="checklistContainer"></div>
    </aside>

    <!-- 오른쪽 패널 (상단 2번 입력창 + 하단 실시간 프롬프트 미리보기) -->
    <div class="right-workspace">

      <!-- 오른쪽 상단 (2번 영역: 선택 항목 내용 입력) -->
      <section class="editor-section">
        <div class="panel-header">
          <div class="panel-title-group">
            <span class="step-badge">2</span>
            <h2 class="panel-title">선택 항목 내용 입력</h2>
            <span class="count-pill" id="activeEditorCountPill">0개 활성</span>
          </div>
          <span class="header-sub-hint">드래그(⋮⋮) 또는 화살표(↑↓)로 순서 변경 시 1번과 자동 동기화</span>
        </div>

        <div class="editor-cards-scroll" id="editorCardsContainer"></div>
      </section>

      <!-- 오른쪽 하단 (실시간 프롬프트 미리보기) -->
      <section class="preview-section">
        <div class="panel-header">
          <div class="panel-title-group">
            <h2 class="panel-title">실시간 프롬프트 미리보기</h2>
          </div>

          <div class="preview-controls">
            <div class="stats-pill">
              <span>공백포함 <strong id="statWithSpace">0</strong>자</span>
              <span>|</span>
              <span>제외 <strong id="statNoSpace">0</strong>자</span>
              <span>|</span>
              <span>예상 <strong id="statTokens">0</strong> tok</span>
            </div>

            <select class="format-select" id="outputFormatSelect" title="출력 형식 선택">
              <option value="bracket">[항목명] 대괄호형</option>
              <option value="markdown">### 마크다운형</option>
              <option value="xml">&lt;XML&gt; 태그형</option>
              <option value="colon">항목명: 콜론형</option>
            </select>

            <button type="button" class="btn btn-soft" id="btnPreviewCopy" style="height: 28px; padding: 0 10px;">복사</button>
          </div>
        </div>

        <div class="preview-body">
          <div class="preview-box" id="previewOutputBox"></div>
        </div>
      </section>

    </div>
  </main>

  <!-- 삭제 확인 모달 -->
  <div class="modal-backdrop" id="confirmModal">
    <div class="modal-card">
      <div class="modal-title" id="modalTitle">삭제 확인</div>
      <div class="modal-desc" id="modalDesc">정말로 삭제하시겠습니까?</div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="btnModalCancel">취소</button>
        <button type="button" class="btn btn-primary" id="btnModalConfirm" style="background-color: var(--danger); border-color: var(--danger);">삭제하기</button>
      </div>
    </div>
  </div>

  <!-- 토스트 알림 컨테이너 -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'ai_prompt_studio_v3_state';

      // =====================================================================
      // 1. 초기 프리셋 데이터 생성기 (처음 열었을 때 빈 화면이 되지 않도록 보장)
      // =====================================================================
      function createDefaultFields() {
        return [
          {
            id: 'f_name',
            label: '이름',
            checked: true,
            placeholder: '캐릭터의 이름, 호칭, 별명 등을 입력하세요 (예: 서지한 / 한이)',
            content: ''
          },
          {
            id: 'f_appearance',
            label: '외모',
            checked: true,
            placeholder: '나이대, 키, 체형, 머리색, 눈동자, 인상, 복장 스타일 등을 묘사하세요.',
            content: ''
          },
          {
            id: 'f_personality',
            label: '성격',
            checked: true,
            placeholder: '겉으로 드러나는 성격, 내면의 가치관, 장단점, 특이 습관 등을 작성하세요.',
            content: ''
          },
          {
            id: 'f_speech',
            label: '말투',
            checked: true,
            placeholder: '존댓말/반말 여부, 어조, 자주 쓰는 감탄사나 대사 예시를 적어주세요.',
            content: ''
          },
          {
            id: 'f_worldview',
            label: '세계관',
            checked: true,
            placeholder: '시대적 배경, 주요 장소, 사용자(유저)와의 관계 설정을 입력하세요.',
            content: ''
          },
          {
            id: 'f_first_msg',
            label: '첫 인사말',
            checked: true,
            placeholder: '채팅 시작 시 캐릭터가 건네는 첫 상황 묘사와 대사를 작성하세요.',
            content: ''
          },
          {
            id: 'f_system',
            label: '시스템 지침',
            checked: true,
            placeholder: 'AI가 반드시 지켜야 할 서술 규칙, 금지 사항, 출력 분량 지침을 입력하세요.',
            content: ''
          }
        ];
      }

      function createDefaultProject(title) {
        return {
          id: 'proj_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          title: title || '기본 캐릭터 시트',
          fields: createDefaultFields()
        };
      }

      // =====================================================================
      // 2. 애플리케이션 상태 관리 및 로컬 스토리지 동기화
      // =====================================================================
      let appState = {
        projects: [],
        activeProjectId: null,
        outputFormat: 'bracket'
      };

      let draggedGlobalIndex = null;
      let editingFieldId = null;

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.projects) && parsed.projects.length > 0) {
              appState = {
                projects: parsed.projects,
                activeProjectId: parsed.activeProjectId || parsed.projects[0].id,
                outputFormat: parsed.outputFormat || 'bracket'
              };
              if (!appState.projects.some(p => p.id === appState.activeProjectId)) {
                appState.activeProjectId = appState.projects[0].id;
              }
              return;
            }
          }
        } catch (err) {
          console.warn('저장된 데이터를 불러오는 중 오류가 발생하여 기본값으로 초기화합니다.', err);
        }

        // 저장된 데이터가 없으면 기본 시트 1개 생성
        const initialProj = createDefaultProject('캐릭터 시트 #1');
        appState = {
          projects: [initialProj],
          activeProjectId: initialProj.id,
          outputFormat: 'bracket'
        };
        saveState();
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
          const badge = document.getElementById('saveStatusBadge');
          if (badge) {
            badge.innerHTML = '<span class="save-dot"></span><span>자동 저장됨</span>';
          }
        } catch (err) {
          console.warn('로컬 스토리지 저장 실패:', err);
        }
      }

      function getActiveProject() {
        let proj = appState.projects.find(p => p.id === appState.activeProjectId);
        if (!proj) {
          if (appState.projects.length === 0) {
            proj = createDefaultProject('캐릭터 시트 #1');
            appState.projects.push(proj);
          } else {
            proj = appState.projects[0];
          }
          appState.activeProjectId = proj.id;
        }
        return proj;
      }

      // =====================================================================
      // 3. 멀티 게시글 / 시트 탭 관리
      // =====================================================================
      function renderProjectTabs() {
        const listEl = document.getElementById('projectTabsList');
        const titleInput = document.getElementById('activeSheetTitleInput');
        const activeProj = getActiveProject();

        listEl.innerHTML = '';
        appState.projects.forEach(proj => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'sheet-tab' + (proj.id === activeProj.id ? ' active' : '');
          btn.textContent = proj.title || '제목 없음';
          btn.onclick = function () {
            if (appState.activeProjectId !== proj.id) {
              appState.activeProjectId = proj.id;
              editingFieldId = null;
              saveState();
              renderAll();
            }
          };
          listEl.appendChild(btn);
        });

        titleInput.value = activeProj.title || '';
      }

      function createNewProject() {
        const nextNum = appState.projects.length + 1;
        const newProj = createDefaultProject('캐릭터 시트 #' + nextNum);
        appState.projects.push(newProj);
        appState.activeProjectId = newProj.id;
        editingFieldId = null;
        saveState();
        renderAll();
        showToast('새 시트가 추가되었습니다.');
      }

      function renameActiveProject(newTitle) {
        const proj = getActiveProject();
        proj.title = newTitle.trim() || '제목 없음';
        saveState();
        renderProjectTabs();
        renderPreview();
      }

      function duplicateActiveProject() {
        const proj = getActiveProject();
        const cloned = {
          id: 'proj_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          title: (proj.title || '시트') + ' (복사본)',
          fields: proj.fields.map(f => ({
            ...f,
            id: 'f_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)
          }))
        };
        appState.projects.push(cloned);
        appState.activeProjectId = cloned.id;
        saveState();
        renderAll();
        showToast('현재 시트가 복제되었습니다.');
      }

      function deleteActiveProject() {
        if (appState.projects.length <= 1) {
          showToast('최소 1개의 시트는 유지해야 합니다.', 'error');
          return;
        }
        const proj = getActiveProject();
        openConfirmModal(
          '시트 삭제',
          `"${proj.title}" 시트를 정말 삭제하시겠습니까? 작성한 내용이 모두 삭제됩니다.`,
          function () {
            appState.projects = appState.projects.filter(p => p.id !== proj.id);
            appState.activeProjectId = appState.projects[0].id;
            saveState();
            renderAll();
            showToast('시트가 삭제되었습니다.');
          }
        );
      }

      // =====================================================================
      // 4. 왼쪽 패널 (1번 영역: 항목 체크리스트 & 순서 변경)
      // =====================================================================
      function renderChecklist() {
        const proj = getActiveProject();
        const container = document.getElementById('checklistContainer');
        const countPill = document.getElementById('checkedCountPill');

        const checkedCount = proj.fields.filter(f => f.checked).length;
        countPill.textContent = checkedCount + '개 선택';

        container.innerHTML = '';

        proj.fields.forEach((field, index) => {
          const row = document.createElement('div');
          row.className = 'check-item' + (field.checked ? ' checked' : '');
          row.dataset.index = index;

          // 드래그 앤 드롭 이벤트
          row.addEventListener('dragstart', function (e) {
            draggedGlobalIndex = index;
            row.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
          });
          row.addEventListener('dragend', function () {
            row.classList.remove('dragging');
            row.draggable = false;
            document.querySelectorAll('.check-item').forEach(el => el.classList.remove('drag-over'));
          });
          row.addEventListener('dragover', function (e) {
            e.preventDefault();
            if (draggedGlobalIndex !== null && draggedGlobalIndex !== index) {
              row.classList.add('drag-over');
            }
          });
          row.addEventListener('dragleave', function () {
            row.classList.remove('drag-over');
          });
          row.addEventListener('drop', function (e) {
            e.preventDefault();
            row.classList.remove('drag-over');
            if (draggedGlobalIndex !== null && draggedGlobalIndex !== index) {
              moveField(draggedGlobalIndex, index);
            }
            draggedGlobalIndex = null;
          });

          // 좌측 영역 (드래그 핸들 + 체크박스 + 항목명/인라인수정)
          const leftDiv = document.createElement('div');
          leftDiv.className = 'check-item-left';

          const handle = document.createElement('span');
          handle.className = 'drag-handle';
          handle.textContent = '⋮⋮';
          handle.title = '드래그하여 순서 변경';
          handle.onmousedown = function () { row.draggable = true; };
          handle.onmouseup = function () { row.draggable = false; };

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.className = 'item-checkbox';
          checkbox.checked = !!field.checked;
          checkbox.onchange = function () {
            field.checked = checkbox.checked;
            saveState();
            renderAll();
          };

          leftDiv.appendChild(handle);
          leftDiv.appendChild(checkbox);

          if (editingFieldId === field.id) {
            const editInput = document.createElement('input');
            editInput.type = 'text';
            editInput.className = 'item-inline-edit';
            editInput.value = field.label;

            const finishEdit = function () {
              const trimmed = editInput.value.trim();
              if (trimmed) {
                field.label = trimmed;
              }
              editingFieldId = null;
              saveState();
              renderAll();
            };

            editInput.onblur = finishEdit;
            editInput.onkeydown = function (e) {
              if (e.key === 'Enter') {
                e.preventDefault();
                finishEdit();
              } else if (e.key === 'Escape') {
                editingFieldId = null;
                renderChecklist();
              }
            };

            leftDiv.appendChild(editInput);
            setTimeout(() => {
              editInput.focus();
              editInput.select();
            }, 10);
          } else {
            const labelSpan = document.createElement('span');
            labelSpan.className = 'item-label-text';
            labelSpan.textContent = field.label;
            labelSpan.title = '클릭: 선택/해제 | 더블클릭: 이름 수정';
            labelSpan.onclick = function () {
              field.checked = !field.checked;
              saveState();
              renderAll();
            };
            labelSpan.ondblclick = function (e) {
              e.stopPropagation();
              editingFieldId = field.id;
              renderChecklist();
            };
            leftDiv.appendChild(labelSpan);
          }

          // 우측 버튼 그룹 (수정, 위로, 아래로, 삭제)
          const actionsDiv = document.createElement('div');
          actionsDiv.className = 'item-actions';

          const btnEdit = document.createElement('button');
          btnEdit.type = 'button';
          btnEdit.className = 'icon-btn';
          btnEdit.textContent = '✎';
          btnEdit.title = '항목 이름 수정';
          btnEdit.onclick = function () {
            editingFieldId = field.id;
            renderChecklist();
          };

          const btnUp = document.createElement('button');
          btnUp.type = 'button';
          btnUp.className = 'icon-btn';
          btnUp.textContent = '↑';
          btnUp.title = '위로 이동';
          btnUp.disabled = index === 0;
          btnUp.onclick = function () {
            moveField(index, index - 1);
          };

          const btnDown = document.createElement('button');
          btnDown.type = 'button';
          btnDown.className = 'icon-btn';
          btnDown.textContent = '↓';
          btnDown.title = '아래로 이동';
          btnDown.disabled = index === proj.fields.length - 1;
          btnDown.onclick = function () {
            moveField(index, index + 1);
          };

          const btnDel = document.createElement('button');
          btnDel.type = 'button';
          btnDel.className = 'icon-btn del';
          btnDel.textContent = '×';
          btnDel.title = '항목 삭제';
          btnDel.onclick = function () {
            deleteFieldItem(field.id);
          };

          actionsDiv.appendChild(btnEdit);
          actionsDiv.appendChild(btnUp);
          actionsDiv.appendChild(btnDown);
          actionsDiv.appendChild(btnDel);

          row.appendChild(leftDiv);
          row.appendChild(actionsDiv);
          container.appendChild(row);
        });
      }

      function addCustomField(labelText) {
        const trimmed = labelText.trim();
        if (!trimmed) {
          showToast('추가할 항목 이름을 입력해주세요.', 'error');
          return;
        }
        const proj = getActiveProject();
        const newField = {
          id: 'f_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          label: trimmed,
          checked: true,
          placeholder: `${trimmed}에 대한 상세 내용을 입력하세요...`,
          content: ''
        };
        proj.fields.push(newField);
        saveState();
        renderAll();
        showToast(`"${trimmed}" 항목이 추가되었습니다.`);

        setTimeout(() => {
          const ta = document.getElementById('ta_' + newField.id);
          if (ta) ta.focus();
        }, 30);
      }

      function moveField(fromIdx, toIdx) {
        const proj = getActiveProject();
        if (toIdx < 0 || toIdx >= proj.fields.length) return;
        const [moved] = proj.fields.splice(fromIdx, 1);
        proj.fields.splice(toIdx, 0, moved);
        saveState();
        renderAll();
      }

      function deleteFieldItem(fieldId) {
        const proj = getActiveProject();
        const field = proj.fields.find(f => f.id === fieldId);
        if (!field) return;

        if (field.content && field.content.trim().length > 0) {
          openConfirmModal(
            '항목 삭제',
            `"${field.label}" 항목에 작성된 내용이 있습니다. 정말 삭제하시겠습니까?`,
            function () {
              proj.fields = proj.fields.filter(f => f.id !== fieldId);
              saveState();
              renderAll();
              showToast('항목이 삭제되었습니다.');
            }
          );
        } else {
          proj.fields = proj.fields.filter(f => f.id !== fieldId);
          saveState();
          renderAll();
        }
      }

      // =====================================================================
      // 5. 오른쪽 상단 (2번 영역: 선택된 항목 내용 입력 카드)
      // =====================================================================
      function renderEditorCards() {
        const proj = getActiveProject();
        const container = document.getElementById('editorCardsContainer');
        const countPill = document.getElementById('activeEditorCountPill');

        const activeEntries = proj.fields
          .map((field, globalIndex) => ({ field, globalIndex }))
          .filter(entry => entry.field.checked);

        countPill.textContent = activeEntries.length + '개 활성';
        container.innerHTML = '';

        if (activeEntries.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty-state-box';
          empty.innerHTML = '<strong>선택된 항목이 없습니다</strong>왼쪽 [1 항목 및 순서]에서 항목을 체크하거나 새 항목을 추가해주세요.';
          container.appendChild(empty);
          return;
        }

        activeEntries.forEach(({ field, globalIndex }, activeIdx) => {
          const card = document.createElement('div');
          card.className = 'editor-card';
          card.dataset.globalIndex = globalIndex;

          // 2번 영역 드래그 앤 드롭 (1번 영역과 양방향 동기화)
          card.addEventListener('dragstart', function (e) {
            if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') {
              e.preventDefault();
              return;
            }
            draggedGlobalIndex = globalIndex;
            card.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
          });
          card.addEventListener('dragend', function () {
            card.classList.remove('dragging');
            card.draggable = false;
            document.querySelectorAll('.editor-card').forEach(el => el.classList.remove('drag-over'));
          });
          card.addEventListener('dragover', function (e) {
            e.preventDefault();
            if (draggedGlobalIndex !== null && draggedGlobalIndex !== globalIndex) {
              card.classList.add('drag-over');
            }
          });
          card.addEventListener('dragleave', function () {
            card.classList.remove('drag-over');
          });
          card.addEventListener('drop', function (e) {
            e.preventDefault();
            card.classList.remove('drag-over');
            if (draggedGlobalIndex !== null && draggedGlobalIndex !== globalIndex) {
              moveField(draggedGlobalIndex, globalIndex);
              showToast('항목 순서가 동기화되었습니다.');
            }
            draggedGlobalIndex = null;
          });

          // 카드 헤더
          const cardHeader = document.createElement('div');
          cardHeader.className = 'card-header';

          const headerLeft = document.createElement('div');
          headerLeft.className = 'card-header-left';

          const handle = document.createElement('span');
          handle.className = 'drag-handle';
          handle.textContent = '⋮⋮';
          handle.title = '드래그하여 순서 변경';
          handle.onmousedown = function () { card.draggable = true; };
          handle.onmouseup = function () { card.draggable = false; };

          const orderBadge = document.createElement('span');
          orderBadge.className = 'order-num';
          orderBadge.textContent = String(activeIdx + 1);

          const titleInput = document.createElement('input');
          titleInput.type = 'text';
          titleInput.className = 'card-title-input';
          titleInput.value = field.label;
          titleInput.title = '클릭하여 항목 제목 수정';
          titleInput.onchange = function () {
            field.label = titleInput.value.trim() || '이름 없는 항목';
            saveState();
            renderChecklist();
            renderPreview();
          };

          headerLeft.appendChild(handle);
          headerLeft.appendChild(orderBadge);
          headerLeft.appendChild(titleInput);

          const headerRight = document.createElement('div');
          headerRight.className = 'card-header-right';

          const btnUp = document.createElement('button');
          btnUp.type = 'button';
          btnUp.className = 'card-action-btn';
          btnUp.textContent = '↑';
          btnUp.title = '순서 위로 이동';
          btnUp.disabled = activeIdx === 0;
          btnUp.onclick = function () {
            moveActiveStep(field.id, -1);
          };

          const btnDown = document.createElement('button');
          btnDown.type = 'button';
          btnDown.className = 'card-action-btn';
          btnDown.textContent = '↓';
          btnDown.title = '순서 아래로 이동';
          btnDown.disabled = activeIdx === activeEntries.length - 1;
          btnDown.onclick = function () {
            moveActiveStep(field.id, 1);
          };

          const btnUncheck = document.createElement('button');
          btnUncheck.type = 'button';
          btnUncheck.className = 'card-action-btn uncheck';
          btnUncheck.textContent = '선택 해제';
          btnUncheck.title = '체크 해제 (입력한 내용은 보존됩니다)';
          btnUncheck.onclick = function () {
            field.checked = false;
            saveState();
            renderAll();
          };

          headerRight.appendChild(btnUp);
          headerRight.appendChild(btnDown);
          headerRight.appendChild(btnUncheck);

          cardHeader.appendChild(headerLeft);
          cardHeader.appendChild(headerRight);

          // 카드 입력 본문
          const cardBody = document.createElement('div');
          cardBody.className = 'card-body';

          const textarea = document.createElement('textarea');
          textarea.id = 'ta_' + field.id;
          textarea.className = 'card-textarea';
          textarea.placeholder = field.placeholder || '내용을 입력하세요...';
          textarea.value = field.content || '';
          textarea.oninput = function () {
            field.content = textarea.value;
            saveState();
            renderPreview();
          };

          cardBody.appendChild(textarea);

          card.appendChild(cardHeader);
          card.appendChild(cardBody);
          container.appendChild(card);
        });
      }

      function moveActiveStep(fieldId, direction) {
        const proj = getActiveProject();
        const currIdx = proj.fields.findIndex(f => f.id === fieldId);
        if (currIdx === -1) return;

        if (direction < 0) {
          for (let i = currIdx - 1; i >= 0; i--) {
            if (proj.fields[i].checked) {
              moveField(currIdx, i);
              break;
            }
          }
        } else {
          for (let i = currIdx + 1; i < proj.fields.length; i++) {
            if (proj.fields[i].checked) {
              moveField(currIdx, i);
              break;
            }
          }
        }
      }

      // =====================================================================
      // 6. 오른쪽 하단 (실시간 프롬프트 미리보기 & 토큰 계산)
      // =====================================================================
      function buildCompiledPrompt() {
        const proj = getActiveProject();
        const activeFields = proj.fields.filter(f => f.checked);
        const blocks = [];

        activeFields.forEach(field => {
          const label = (field.label || '').trim();
          const body = (field.content || '').trim();
          if (!body) return;

          switch (appState.outputFormat) {
            case 'markdown':
              blocks.push(`### ${label}\n${body}`);
              break;
            case 'xml': {
              const safeTag = label.replace(/[^a-zA-Z0-9가-힣_]/g, '_') || 'item';
              blocks.push(`<${safeTag}>\n${body}\n</${safeTag}>`);
              break;
            }
            case 'colon':
              blocks.push(`${label}: ${body}`);
              break;
            case 'bracket':
            default:
              blocks.push(`[${label}]\n${body}`);
              break;
          }
        });

        return blocks.join('\n\n');
      }

      function estimateTokens(text) {
        if (!text) return 0;
        let tokens = 0;
        for (let i = 0; i < text.length; i++) {
          const code = text.charCodeAt(i);
          if (code >= 0xAC00 && code <= 0xD7A3) {
            tokens += 0.65; // 한글 음절 근사
          } else if (code <= 0x007F) {
            tokens += 0.28; // 영문/숫자/기호 근사
          } else {
            tokens += 0.6;
          }
        }
        return Math.ceil(tokens);
      }

      function renderPreview() {
        const compiled = buildCompiledPrompt();
        const previewBox = document.getElementById('previewOutputBox');

        if (!compiled) {
          previewBox.innerHTML = '<span class="preview-placeholder">위 2번 입력창에 내용을 작성하면 선택한 형식에 맞춰 실시간으로 프롬프트가 조립됩니다.</span>';
        } else {
          previewBox.textContent = compiled;
        }

        const withSpace = compiled.length;
        const noSpace = compiled.replace(/\s/g, '').length;
        const tokens = estimateTokens(compiled);

        document.getElementById('statWithSpace').textContent = withSpace.toLocaleString();
        document.getElementById('statNoSpace').textContent = noSpace.toLocaleString();
        document.getElementById('statTokens').textContent = tokens.toLocaleString();
      }

      // =====================================================================
      // 7. 복사, TXT 메모장 다운로드 및 JSON 백업/복원
      // =====================================================================
      function copyToClipboard() {
        const text = buildCompiledPrompt();
        if (!text) {
          showToast('복사할 내용이 없습니다. 먼저 내용을 입력해주세요.', 'error');
          return;
        }

        const helper = document.createElement('textarea');
        helper.value = text;
        helper.style.position = 'fixed';
        helper.style.left = '-9999px';
        document.body.appendChild(helper);
        helper.select();

        try {
          const ok = document.execCommand('copy');
          if (ok) {
            showToast('클립보드에 프롬프트가 복사되었습니다.');
          } else if (navigator.clipboard) {
            navigator.clipboard.writeText(text);
            showToast('클립보드에 프롬프트가 복사되었습니다.');
          }
        } catch (err) {
          showToast('복사 중 오류가 발생했습니다.', 'error');
        } finally {
          document.body.removeChild(helper);
        }
      }

      function downloadTxtFile() {
        const text = buildCompiledPrompt();
        if (!text) {
          showToast('다운로드할 내용이 없습니다. 먼저 내용을 입력해주세요.', 'error');
          return;
        }

        const proj = getActiveProject();
        const safeName = (proj.title || '시트').replace(/[\\/:*?"<>|]/g, '_');
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);

        const link = document.createElement('a');
        link.href = url;
        link.download = `[제작]_${safeName}.txt`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);

        showToast(`"[제작]_${safeName}.txt" 메모장이 다운로드되었습니다.`);
      }

      function exportAllJson() {
        const jsonStr = JSON.stringify(appState, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const today = new Date().toISOString().slice(0, 10);

        const link = document.createElement('a');
        link.href = url;
        link.download = `제작_전체백업_${today}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);

        showToast('전체 시트가 JSON 파일로 백업되었습니다.');
      }

      function importAllJson(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function (e) {
          try {
            const parsed = JSON.parse(e.target.result);
            if (!parsed || !Array.isArray(parsed.projects) || parsed.projects.length === 0) {
              throw new Error('Invalid format');
            }
            appState = {
              projects: parsed.projects,
              activeProjectId: parsed.activeProjectId || parsed.projects[0].id,
              outputFormat: parsed.outputFormat || 'bracket'
            };
            if (!appState.projects.some(p => p.id === appState.activeProjectId)) {
              appState.activeProjectId = appState.projects[0].id;
            }
            saveState();
            renderAll();
            showToast(`${appState.projects.length}개의 시트를 복원했습니다.`);
          } catch (err) {
            showToast('올바른 백업 JSON 파일이 아닙니다.', 'error');
          } finally {
            event.target.value = '';
          }
        };
        reader.readAsText(file);
      }

      // =====================================================================
      // 8. 모달 및 토스트 알림
      // =====================================================================
      function openConfirmModal(title, desc, onConfirm) {
        const modal = document.getElementById('confirmModal');
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalDesc').textContent = desc;

        const confirmBtn = document.getElementById('btnModalConfirm');
        confirmBtn.onclick = function () {
          closeConfirmModal();
          onConfirm();
        };

        modal.classList.add('open');
      }

      function closeConfirmModal() {
        document.getElementById('confirmModal').classList.remove('open');
      }

      function showToast(msg, type) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = 'toast' + (type === 'error' ? ' error' : '');
        toast.textContent = msg;
        container.appendChild(toast);

        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transition = 'opacity 0.2s ease';
          setTimeout(() => toast.remove(), 200);
        }, 2400);
      }

      // =====================================================================
      // 9. 전체 UI 렌더링 및 이벤트 바인딩
      // =====================================================================
      function renderAll() {
        document.getElementById('outputFormatSelect').value = appState.outputFormat || 'bracket';
        renderProjectTabs();
        renderChecklist();
        renderEditorCards();
        renderPreview();
      }

      function bindEvents() {
        document.getElementById('btnExportJson').onclick = exportAllJson;
        document.getElementById('inputImportJson').onchange = importAllJson;
        document.getElementById('btnHeaderCopy').onclick = copyToClipboard;
        document.getElementById('btnPreviewCopy').onclick = copyToClipboard;
        document.getElementById('btnDownloadTxt').onclick = downloadTxtFile;

        document.getElementById('btnNewSheet').onclick = createNewProject;
        document.getElementById('btnDuplicateSheet').onclick = duplicateActiveProject;
        document.getElementById('btnDeleteSheet').onclick = deleteActiveProject;

        const titleInput = document.getElementById('activeSheetTitleInput');
        titleInput.onchange = function () { renameActiveProject(titleInput.value); };
        titleInput.onkeydown = function (e) {
          if (e.key === 'Enter') titleInput.blur();
        };

        document.getElementById('addFieldForm').onsubmit = function (e) {
          e.preventDefault();
          const input = document.getElementById('newFieldInput');
          addCustomField(input.value);
          input.value = '';
        };

        document.getElementById('outputFormatSelect').onchange = function (e) {
          appState.outputFormat = e.target.value;
          saveState();
          renderPreview();
        };

        document.getElementById('btnModalCancel').onclick = closeConfirmModal;
      }

      function init() {
        loadState();
        bindEvents();
        renderAll();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
